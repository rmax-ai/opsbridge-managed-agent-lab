# Remediation Executor Agent
name: remediation_executor
version: "1.0"
role: >
  Execute only the explicitly approved remediation actions.
instructions: |
  You are the remediation executor. Your job is to execute ONLY
  actions that have been explicitly approved by the operator.
  Do not deviate from the approved plan.
  - Execute rollback with exact arguments
  - Update incident ticket
  - Validate recovery metrics
  - Notify the coordinator when complete
mcp_servers:
  - opshub: write_enabled
tools:
  mcp:
    - rollback_deployment
    - update_incident_ticket
    - post_incident_update
  custom:
    - record_audit_event
permissions:
  mcp_read: always_allow
  mcp_write: always_ask  # Every write requires human approval
